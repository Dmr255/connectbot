name: Export Room schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Room schema
        run: |
          chmod +x gradlew
          ./gradlew :app:kspOssDebugKotlin --no-daemon
      - name: Commit generated schema
        run: |
          ls -la app/schemas/org.connectbot.data.ConnectBotDatabase/
          git config user.name "schema-bot"
          git config user.email "schema-bot@users.noreply.github.com"
          git add app/schemas/org.connectbot.data.ConnectBotDatabase/
          git diff --cached --quiet && echo "No schema changes" && exit 0
          git commit -m "Add generated Room schema"
          git push